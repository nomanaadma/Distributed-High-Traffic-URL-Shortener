name: CosmosDB Trigger Function

on:
  push:
    branches: [ "main" ]
    paths:
      - CosmosDbTrigger/**
  pull_request:
    branches: [ "main" ]
    paths:
      - CosmosDbTrigger/**
  workflow_dispatch: # manual trigger

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'CosmosDbTrigger/src/URL-Shortener.CosmosDbTriggerFunction'
  DOTNET_VERSION: '10.0.x'
  BUILD_ARTIFACT_NAME: 'cosmosdb-trigger-package'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # Required for actions/checkout
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v6

      - name: 'Set up .NET version: ${{ env.DOTNET_VERSION }}'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Perform additional steps such as running tests, if needed

      - name: 'Build and prepare .NET project for deployment'
        shell: bash
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: dotnet publish --configuration Release --output ./output

      - name: 'Upload artifact for the deployment job'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/output
          include-hidden-files: true  # Required for .NET projects

  deploy-dev:
    # Deploy only on push to main or manual run (PRs just build)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment: Development
    permissions:
      id-token: write  # Required for OIDC
    steps:
      - name: 'Download artifact from build job'
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}  
          path: './downloaded-artifact'

      - name: 'Log in to Azure with AZ CLI'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: 'Run the Azure Functions action'
        uses: Azure/functions-action@v1
        id: deploy-to-function-app
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: './downloaded-artifact'